
name: Build REDDY FARMS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir project
          unzip -o REDDY_FARMS_Phone_Build_Project_v16.zip -d project

      - name: Build APK
        run: gradle -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: REDDY-FARMS-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
